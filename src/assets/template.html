<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkBuddy Token消耗看板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fafaf9;--card:#fff;--border:#e8e5df;--border2:#e4e1da;--border3:#efede8;--t1:#1f2328;--t2:#6f6c64;--t3:#9a978f;--t4:#b5b2a9;--t5:#a3a099;--t6:#55524b;--wcnm:#374151;--tdc:#3d3b36;--row:#f2f0ea;--empty:#f4f2ed;--hover:#fbfaf7;--focus:#c9c6be;--sep:#d4d1c9;--selbg:#e9f0f7;--selfg:#3f6b99;--selbd:#aec9e0;--red:#d64545;--blue:#5f8cb6;--tipbg:#1f2328;--tiptc:#fff;--font-ui:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;--fs-hero:76px;--fs-hero-md:44px;--fs-hero-sm:37px;--fs-kpi:22px;--fs-kpi-md:19px;--fs-kpi-sm:17px;--fs-t1:20px;--fs-t2:18px;--fs-t3:16.5px;--fs-body:15px;--fs-aux:13px;--fs-cap:11.5px;--fs-micro:10.5px;--sb-thumb:#c9c6be;--sb-thumb-hover:#a8a49b}
body.dark{--bg:#1c1b19;--card:#262521;--border:#3a3833;--border2:#3a3833;--border3:#35332e;--t1:#f0eee9;--t2:#b5b2a9;--t3:#8a877f;--t4:#6f6d66;--t5:#8a877f;--t6:#d5d2ca;--wcnm:#c5c2ba;--tdc:#c5c2ba;--row:#323029;--empty:#2e2c29;--hover:#2a2925;--focus:#55524b;--sep:#4a4842;--selbg:#2c3a47;--selfg:#a9c9e4;--selbd:#4a6a85;--red:#e06666;--blue:#8fb8d9;--tipbg:#f0eee9;--tiptc:#1c1b19;--sb-thumb:#4a4842;--sb-thumb-hover:#6f6d66;color-scheme:dark}
body{font-family:var(--font-ui);background:var(--bg);color:var(--t1);padding:22px 18px 60px;max-width:1600px;margin:0 auto}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.colL,.colR{min-width:0}
h1{font-size:var(--fs-t1);font-weight:700;letter-spacing:.3px}
.sub{font-size:var(--fs-cap);color:var(--t3);margin-top:3px;display:flex;align-items:center;gap:8px}
.tbtn{border:1px solid var(--border2);background:var(--card);color:var(--t2);font-size:var(--fs-cap);padding:1px 10px;border-radius:999px;cursor:pointer}
.tbtn:hover{border-color:var(--focus);color:var(--t1)}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
.pill{border:1px solid var(--border2);background:var(--card);color:var(--t2);font-size:var(--fs-aux);padding:5px 14px;border-radius:6px;cursor:pointer;margin-left:6px}
.pill.on{background:var(--selbg);color:var(--selfg);border-color:var(--selbd)}
.pill.on{box-shadow:0 0 0 2px var(--selbd) inset}
.busy{position:fixed;top:14px;right:18px;z-index:50;display:none;align-items:center;gap:7px;background:var(--tipbg);color:var(--tiptc);font-size:var(--fs-aux);padding:7px 13px;border-radius:9px;box-shadow:0 3px 12px rgba(0,0,0,.22)}
.busy::before{content:'';width:11px;height:11px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lrow.on{background:var(--selbg);box-shadow:inset 3px 0 0 0 var(--selfg);color:var(--selfg);font-weight:600}
.datepick{border:1px solid var(--border2);background:var(--card);color:var(--t2);font-size:var(--fs-aux);padding:4px 8px;border-radius:6px;outline:none;vertical-align:middle}
.datepick:focus{border-color:var(--focus)}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:6px}
.sec-h h2{font-size:var(--fs-body);font-weight:400}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 15px;min-width:0}
.kpi .k{font-size:var(--fs-cap);color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:var(--fs-t1);font-weight:700;color:var(--t1);margin-top:6px;white-space:nowrap}
.kpi .v small{font-size:var(--fs-aux);color:var(--t3);font-weight:600;margin-left:3px}
.t5{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 9px;min-width:0;cursor:pointer;transition:background .15s,border-color .15s}
.t5:hover{border-color:var(--focus)}
.t5.on{background:var(--selbg);border-color:var(--selbd)}
.t5.on .k,.t5.on .v{color:var(--selfg)}
.t5 .k{font-size:var(--fs-micro);color:var(--t5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t5 .k i{width:6px;height:6px;margin-right:3px;vertical-align:0}
.t5 .v{font-size:var(--fs-cap);font-weight:600;color:var(--t6);white-space:nowrap;flex:none}
.heat-wrap{max-height:640px;overflow-y:auto;border:1px solid var(--border3);border-radius:8px;padding:6px 8px}
.hrow{display:flex;align-items:center;gap:2px;margin-bottom:-1px}
.hlab{width:42px;flex:none;font-size:var(--fs-micro);color:var(--t3)}
.hcell{flex:1;height:7.3px;border-radius:0;background:var(--empty);cursor:default}
.hhead{display:flex;gap:2px;margin:0 1px 4px;padding-left:8px;padding-right:8px}
.hhead span{flex:1;min-width:0;text-align:center;font-size:var(--fs-micro);color:var(--t4)}
.legend{display:flex;align-items:center;gap:4px;font-size:var(--fs-micro);color:var(--t3)}
.legend i{width:14px;height:10px;border-radius:2px;display:inline-block}
.caption{font-size:var(--fs-cap);color:var(--t3);margin-bottom:6px}
.bandbar{display:flex;height:14px;border-radius:5px;overflow:hidden;margin:8px 0 10px}
.bandbar div{height:100%}
.bandrow{display:flex;justify-content:space-between;font-size:var(--fs-cap);color:var(--t2);margin-bottom:3px}
.tools{display:flex;gap:6px;align-items:center}
.tools input{border:1px solid var(--border2);border-radius:6px;padding:5px 10px;font-size:var(--fs-aux);width:110px;background:var(--card);color:var(--t1);outline:none}
.tools input:focus{border-color:var(--focus)}
.chip{border:1px solid var(--border2);background:var(--card);color:var(--t2);font-size:var(--fs-cap);padding:4px 10px;border-radius:6px;cursor:pointer}
.chip.on{background:var(--selbg);color:var(--selfg);border-color:var(--selbd)}
.crumb{font-size:var(--fs-aux);color:var(--t3);margin-bottom:10px;display:none;align-items:center;gap:10px}
.crumb a{color:var(--t2);text-decoration:none;cursor:pointer}
.crumb a:hover{color:var(--selfg)}
.crumb .cur{color:var(--selfg)}
.crumb .sep{margin:0 6px;color:var(--sep)}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--row);cursor:pointer}
.lrow:hover{background:var(--hover)}
.lrow .nm{flex:1.4;min-width:0;font-size:var(--fs-aux);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .meta{flex:.8;font-size:var(--fs-cap);color:var(--t3);white-space:nowrap}
.lrow .bar{flex:1.2;height:7px;background:var(--empty);border-radius:4px;overflow:hidden}
.lrow .bar i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.lrow .num{flex:.9;text-align:right;font-size:var(--fs-aux);font-weight:700;white-space:nowrap}
.lrow .num em{font-style:normal;color:var(--t2);font-weight:600;font-size:var(--fs-cap);margin-left:4px}
.empty{font-size:var(--fs-aux);color:var(--t3);padding:20px 0;text-align:center}
.subgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.wcard{display:flex;align-items:center;gap:10px;padding:3px 2px;border-bottom:1px solid var(--row);cursor:pointer;background:transparent;min-width:0}
.wcard:hover{background:var(--hover)}
.wc-nm{flex:none;width:16%;min-width:0;font-size:var(--fs-aux);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--wcnm)}
.wc-tt{flex:none;width:72px;text-align:right;font-size:var(--fs-body);font-weight:400;color:var(--t1);white-space:nowrap}
.wc-meta{flex:none;width:96px;text-align:right;font-size:var(--fs-cap);color:var(--t2);white-space:nowrap}
.wviz{flex:1.5;display:flex;gap:1px;min-width:0;overflow:hidden}
.wcell{flex:1 1 0;min-width:0;height:10.4px;border-radius:0;background:var(--empty)}
.panel-scroll{max-height:290px;overflow-y:auto;border:1px solid var(--border3);border-radius:8px;padding:2px 10px}
.wsn{flex:none;font-size:var(--fs-micro);border:1px solid var(--border2);border-radius:5px;padding:1px 3px;background:var(--card);color:var(--t2);outline:none}
.band4{display:flex;gap:6px;margin-bottom:12px}
.b4{flex:1;display:flex;justify-content:space-between;align-items:baseline;gap:6px;border:1px solid var(--border3);border-radius:6px;padding:5px 9px;background:var(--card);min-width:0}
.b4k{font-size:var(--fs-cap);color:var(--t2);white-space:nowrap}
.b4v{font-size:var(--fs-aux);font-weight:700;color:var(--t1);white-space:nowrap}
.kpi .s{font-size:var(--fs-micro);color:var(--t4);margin-top:2px;white-space:nowrap}
.view-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.view-t{font-size:var(--fs-body);font-weight:700}
.view-m{font-size:var(--fs-aux);color:var(--t2)}
svg text{font-family:inherit}
table.rt{width:100%;border-collapse:collapse;font-size:var(--fs-cap)}
table.rt th{position:sticky;top:0;background:var(--card);text-align:right;color:var(--t3);font-weight:600;padding:5px 6px;border-bottom:1px solid var(--border)}
table.rt th:first-child,table.rt td:first-child{text-align:left}
table.rt td{text-align:right;padding:4px 6px;border-bottom:1px solid var(--row);color:var(--tdc);white-space:nowrap}
.rt-wrap{max-height:320px;overflow:auto;border:1px solid var(--border3);border-radius:8px}
#tip{position:fixed;background:var(--tipbg);color:var(--tiptc);padding:7px 10px;border-radius:7px;font-size:var(--fs-cap);pointer-events:none;opacity:0;transition:opacity .08s;white-space:pre;z-index:99;line-height:1.55}

/* ========================================================================
   本地改造层：大字号 · 清爽版
   说明：纯覆盖，不改动上方任何原始规则与 JS 逻辑；删掉本段即回到原样式。
   思路：① 正文字阶整体上调约 25–45%；② 加大留白与行距；③ 弱化描边与
   分隔线，让版面透气；④ SVG 内文字统一抬到可读下限。
   ======================================================================== */
body{font-size:var(--fs-body);line-height:1.6;padding:34px 30px 92px;max-width:1780px}
h1{font-size:var(--fs-t1);letter-spacing:.2px}
.sub{font-size:var(--fs-body);margin-top:8px;gap:11px}
.tbtn{font-size:var(--fs-body);padding:3px 13px}
.pill{font-size:var(--fs-body);padding:8px 19px;border-radius:9px;margin-left:8px}
.datepick{font-size:var(--fs-body);padding:7px 11px;border-radius:8px}
header{margin-bottom:24px}
.card{border-radius:16px;padding:26px 28px;margin-bottom:24px;
  border-color:#eeece7;box-shadow:0 1px 2px rgba(31,35,40,.03)}
body.dark .card{border-color:#2E353E}
.sec-h{margin-bottom:20px;gap:10px}
.sec-h h2{font-size:var(--fs-t2);font-weight:500}
.kpis{grid-template-columns:repeat(auto-fit,minmax(186px,1fr));gap:16px;margin-bottom:24px}
.kpi{border-radius:15px;padding:21px 22px}
.kpi .k{font-size:var(--fs-body)}
.kpi .v{font-size:var(--fs-kpi);margin-top:10px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:var(--fs-t3);margin-left:4px}
.kpi .s{font-size:var(--fs-aux);margin-top:6px}
.t5{border-radius:11px;padding:9px 13px}
.t5 .k{font-size:var(--fs-aux)}
.t5 .v{font-size:var(--fs-t3)}
.lrow{padding:9px 0}
.lrow .nm{font-size:var(--fs-body)}
.lrow .meta{font-size:var(--fs-aux)}
.lrow .num{font-size:var(--fs-body)}
.lrow .num em{font-size:var(--fs-cap)}
.wc-nm{font-size:var(--fs-body);width:18%}
.wc-tt{font-size:var(--fs-t3);width:84px}
.wc-meta{font-size:var(--fs-aux);width:96px}
.wnm-wrap{padding:7px 0}
.b4k{font-size:var(--fs-aux)}
.b4v{font-size:var(--fs-t3)}
.caption{font-size:var(--fs-body);margin-bottom:10px;line-height:1.65}
.legend{font-size:var(--fs-aux);gap:9px}
.bandrow{font-size:var(--fs-body);margin-bottom:5px}
.hlab{width:54px;font-size:var(--fs-aux)}
.hcell{height:9.5px}
.hhead span{font-size:var(--fs-cap)}
.heat-wrap{padding:10px 12px;border-color:var(--border3);border-radius:10px}
.empty{font-size:var(--fs-body);padding:26px 0}
.view-t{font-size:var(--fs-t3)}
.view-m{font-size:var(--fs-aux);line-height:1.6}
.chip{font-size:var(--fs-aux);padding:6px 13px}
.breadcrumb,.crumb{font-size:var(--fs-body)}
table.rt{font-size:var(--fs-body)}
table.rt th{padding:9px 9px;font-size:var(--fs-aux)}
table.rt td{padding:8px 9px}
.rt-wrap{border-color:var(--border3);border-radius:10px;max-height:360px}
#tip{font-size:var(--fs-body);padding:10px 14px;border-radius:9px;line-height:1.6}
.bar{height:10px;border-radius:5px}
/* SVG 内文字：统一抬到可读下限（覆盖 presentation attribute） */
svg text{font-size:var(--fs-aux);font-weight:400}
svg text[font-size="8"],svg text[font-size="8.5"],svg text[font-size="9"]{font-size:var(--fs-cap)}
/* ================= V6.5 · 对齐主看板设计系统（冷灰蓝 + 品牌紫，控件同外层 .chk/.btn-ghost 规格） ================= */
:root{--bg:#fff;--card:#fff;
--t1:#0a2540;--t2:#425466;--t3:#8792a2;--t4:#aab6c8;--t5:#8792a2;--t6:#0a2540;
--wcnm:#425466;--tdc:#33415c;
--border:#e6ebf1;--border2:#dbe2ee;--border3:#eef1f6;--sep:#d6dde8;
--row:#f6f8fb;--empty:#f4f6fa;--hover:#fafbfd;--focus:#c9d2e0;
--selbg:#eef0ff;--selfg:#4b41d6;--selbd:#c5c0ff;
--red:#dc2626;--blue:#2563eb;
--ink:#0a2540;--ink2:#425466;--ink3:#8792a2;--ink4:#aab6c8;--rule:#e6ebf1;
--tipbg:#0a2540;--tiptc:#fff;
--sb-thumb:#c9d2e0;--sb-thumb-hover:#aab6c8;
--brand:#635bff;--brand-soft:#eef0ff;--brand-line:#c5c0ff;--brand-ink:#4b41d6}
body.dark{--bg:#12151A;--card:#181C22;
--t1:#E9ECF0;--t2:#A6AEB8;--t3:#7C848F;--t4:#5A626C;--t5:#4A525C;--t6:#E9ECF0;
--wcnm:#C3CAD3;--tdc:#C3CAD3;
--border:#262C34;--border2:#2E353E;--border3:#212831;--sep:#2E353E;
--row:#1C222A;--empty:#1A2028;--hover:#1E242C;--focus:#3A444F;
--selbg:#E9ECF0;--selfg:#12151A;--selbd:#E9ECF0;
--red:#E86A70;--blue:#4A9FE0;
--ink:#E9ECF0;--ink2:#A6AEB8;--ink3:#7C848F;--ink4:#5A626C;--rule:#E9ECF0;
--tipbg:#E9ECF0;--tiptc:#12151A;--sb-thumb:#3A444F;--sb-thumb-hover:#5A626C;color-scheme:dark}
body{font-family:var(--font-ui);background:var(--bg);color:var(--ink);padding:0 0 40px;max-width:none;-webkit-font-smoothing:antialiased}
/* 表单控件不默认继承字族：统一收编到 --font-ui */
button,input,select,textarea{font-family:inherit}
body>header{max-width:1400px;margin:0 auto;padding:46px 40px 0;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
h1{font-size:var(--fs-aux);font-weight:600;letter-spacing:.2em;color:var(--ink2)}
.sub{font-size:var(--fs-cap);color:var(--ink3);margin-top:7px;letter-spacing:.02em;display:flex;align-items:center;gap:9px}
.tbtn,.pill,.chip,.datepick,.tools input{background:var(--card);border:1px solid var(--border2);color:var(--ink2);
  font-size:var(--fs-cap);padding:5px 13px;border-radius:9px;cursor:pointer;outline:none;
  transition:border-color .13s,color .13s,background .13s}
.tbtn:hover,.pill:hover,.chip:hover{border-color:var(--focus);color:var(--ink)}
.pill.on,.chip.on{background:var(--selbg);color:var(--selfg);border-color:var(--selbd);font-weight:600;box-shadow:none}
.tools input:focus,.datepick:focus{border-color:var(--focus)}

/* headline：数字即图形，全页唯一重元素 */
.kpis.kpi-hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));max-width:1400px;margin:26px auto 0;padding:0 40px;gap:16px 0}
.kpis.kpi-hero .kpi{background:none;border:none;border-radius:0;box-shadow:none;padding:15px 16px 13px 0;border-top:1px solid var(--border);margin-right:14px}
.kpis.kpi-hero .kpi .k{font-size:var(--fs-cap);letter-spacing:.08em;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis.kpi-hero .kpi .v{font-size:var(--fs-kpi);font-weight:600;letter-spacing:-.7px;color:var(--ink);margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpis.kpi-hero .kpi .v small{font-size:var(--fs-aux);color:var(--ink3);font-weight:500;margin-left:2px}
.kpis.kpi-hero .kpi .d{font-size:var(--fs-cap)}
.kpis.kpi-hero .kpi .s{font-size:var(--fs-cap);color:var(--ink3);margin-top:5px}
.kpis.kpi-hero .kpi.lead{grid-column:1/-1;border-top:2px solid var(--rule);padding:22px 0 16px;margin-right:0}
.kpis.kpi-hero .kpi.lead .k{font-size:var(--fs-cap);letter-spacing:.2em;color:var(--ink3)}
.kpis.kpi-hero .kpi.lead .v{font-size:var(--fs-hero);font-weight:600;letter-spacing:-3.6px;line-height:.9;margin-top:9px;color:var(--ink)}
.kpis.kpi-hero .kpi.lead .v small{font-size:var(--fs-t1);color:var(--ink3);font-weight:400;margin-left:7px;letter-spacing:-.5px}
.kpis.kpi-hero .kpi.lead .s{font-size:var(--fs-aux);color:var(--ink2);margin-top:13px;line-height:1.6}
.kpis.kpi-hero .kpi.lead .s span{display:block;font-size:var(--fs-cap);color:var(--ink3);margin-top:3px}
/* 计价口径长注释：默认折叠成一行入口，展开后是柔和底色的可读段落 */
.fnote{margin-top:6px}
.fnote summary{width:fit-content;cursor:pointer;user-select:none;list-style:none;
  font-size:var(--fs-cap);font-weight:600;color:var(--t3);padding:5px 12px;border-radius:8px;
  background:var(--empty);transition:color .13s,background .13s}
.fnote summary::-webkit-details-marker{display:none}
.fnote summary::before{content:"▸ ";font-size:10px}
.fnote[open] summary::before{content:"▾ "}
.fnote summary:hover{color:var(--t2);background:#e8ecf3}
.fnote[open] summary{margin-bottom:8px}
.fnote .fnbody{font-size:var(--fs-aux);line-height:1.8;color:var(--t2);
  background:var(--empty);border-radius:10px;padding:12px 15px}

/* 全宽区块：无卡片、无边框、无阴影 */
.act{display:block;max-width:1400px;margin:0 auto;padding:0 40px}
/* 子视图顶部留白 + 同视图多区块间距（原编号标签的 62px 上边距职责由这两条接管） */
.view{padding-top:30px}
.view .act + .act{margin-top:52px}
.act-h{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:2px}
.act-h h2{font-size:var(--fs-t2);font-weight:700;letter-spacing:-.2px;color:var(--ink)}
.act-h h2::before{display:none}
.act-h .cap{font-size:var(--fs-cap);color:var(--ink3)}

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function hm(n){return new Date(n*60000);}
function fdate(d){const p=x=>String(x).padStart(2,'0');return (d.getMonth()+1)+'-'+p(d.getDate());}
function ftime(d){const p=x=>String(x).padStart(2,'0');return p(d.getHours())+':'+p(d.getMinutes());}

function iterReq(cb){

    let tt=0,tn=0;
    const reqs=[];
    for(const r of s.r){const ts=r[0]*60000;if(ts<c)continue;reqs.push(r);tt+=r[2];tn++;}

function aggregate(){
  const c=cut(),hiC=cutHi();
  const daily={},ws={},band=[0,0,0,0];
  const hr=new Array(24).fill(0);
  const mTot=new Array(D.models.length).fill(0);
  const dm={};
  let tot=0,inp=0,out=0,ch=0,turns=0,nsess=0,cost=0,creds=0,ocred=0,ocredN=0,turnsN=0,busy=0,saved=0;
  const tools={};
  const sessAgg=[];
  const mCred=new Array(D.models.length).fill(0);
  const mApi=new Array(D.models.length).fill(0);
  for(const s of D.sess){if(ACCT>=0&&s.a!==ACCT)continue;
    let tt=0,tn=0,first=0,last=0;
    for(const r of s.r){const ts=r[0]*60000;if(ts<c||ts>=hiC)continue;
      const d=hm(r[0]);const dk=fdate(d);const h=d.getHours();
      (daily[dk]=daily[dk]||{h:new Array(24).fill(0),hh:new Array(72).fill(0),tt:0});
      daily[dk].h[h]+=r[2];daily[dk].tt+=r[2];
      daily[dk].hh[h*3+Math.floor(d.getMinutes()/20)]+=r[2];
      hr[h]+=r[2];mTot[r[1]]+=r[2];
      (dm[dk]=dm[dk]||{});dm[dk][r[1]]=(dm[dk][r[1]]||0)+r[2];
      const wn=s.w;ws[wn]=ws[wn]||{tt:0,n:0,cred:0,api:0};ws[wn].tt+=r[2];if(r[7]!=null)ws[wn].cred+=r[7];
      const bi=Math.floor(h/6);band[bi]+=r[2];
      tot+=r[2];inp+=r[3];out+=r[4];ch+=r[5];turns++;tn++;tt+=r[2];if(r[7]!=null){ocred+=r[7];ocredN++;}
      const pp=MP[r[1]];const cht=Math.max(0,Math.min(r[5],r[3]));const cwt=Math.max(0,Math.min(r[6]||0,r[3]-cht));const chunk=(cht*pp[2]+cwt*1.25*pp[0]+(r[3]-cht-cwt)*pp[0]+r[4]*pp[1])/1e6;cost+=chunk;
      saved+=cht*(pp[0]-pp[2])/1e6;  // 缓存省钱：命中部分若按输入价买 API 需多付的差价
      if(r[7]!=null){mCred[r[1]]+=r[7];mApi[r[1]]+=chunk;ws[wn].api+=chunk;}
      creds+=r[2]/1e6*MPM[r[1]];
      if(!first)first=r[0];last=r[0];}
    if(tn){nsess++;(ws[s.w]=ws[s.w]||{tt:0,n:0,cred:0}).n+=1;sessAgg.push({s,tt,tn,first,last});busy+=s.by||0;const tk=s.tk||{};for(const k in tk)tools[k]=(tools[k]||0)+tk[k];}
    else s._=0;
  }
  const wsArr=D.ws.map((nm,i)=>({i,n:nm,tt:(ws[i]||{tt:0}).tt,cnt:(ws[i]||{n:0}).n,cred:(ws[i]||{cred:0}).cred,api:(ws[i]||{api:0}).api})).filter(x=>x.tt>0);
  const tkArr=Object.entries(tools).sort((a,b)=>b[1]-a[1]);
  return {daily,wsArr,band,tot,inp,out,ch,turns,nsess,sessAgg,hr,mTot,dm,cost,creds,ocred,ocredN,busy,tkArr,saved,mCred,mApi};
}

function smoothLine(pts){
  // 单调三次插值（Fritsch-Carlson）：平滑且不过冲
  const n=pts.length;
  if(n<3)return 'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');
  const dx=[],m=[],t=new Array(n);
  for(let i=0;i<n-1;i++)dx.push(pts[i+1][0]-pts[i][0]);
  for(let i=0;i<n-1;i++)m.push((pts[i+1][1]-pts[i][1])/dx[i]);
  t[0]=m[0];t[n-1]=m[n-2];
  for(let i=1;i<n-1;i++)t[i]=(m[i-1]*m[i]<=0)?0:(m[i-1]+m[i])/2;
  for(let i=0;i<n-1;i++){
    if(m[i]===0){t[i]=0;t[i+1]=0;continue;}
    const a=t[i]/m[i],b=t[i+1]/m[i],s=a*a+b*b;
    if(s>9){const f=3/Math.sqrt(s);t[i]=f*a*m[i];t[i+1]=f*b*m[i];}
  }
  let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(let i=0;i<n-1;i++){
    const h=dx[i];
    d+=' C'+(pts[i][0]+h/3).toFixed(1)+' '+(pts[i][1]+t[i]*h/3).toFixed(1)+' '+(pts[i+1][0]-h/3).toFixed(1)+' '+(pts[i+1][1]-t[i+1]*h/3).toFixed(1)+' '+pts[i+1][0].toFixed(1)+' '+pts[i+1][1].toFixed(1);
  }
  return d;
}

function renderRidge(A){

    let body='',hitD='';
    for(const run of runs){
      // 两端补零轴点，使山脊平滑落回基线
      let pts;
      if(run.length===1){

function renderDailyModel(A){
  LASTA=A;
  const svg=$('#dmSvg');const {top}=topModels(A);
  const dates=Object.keys(A.dm).sort();
  const mx=Math.max(...dates.map(d=>Object.values(A.dm[d]).reduce((a,b)=>a+b,0)),1);
  const H=svg.clientHeight||300,pL=44,pR=8,pT=8,pB=18;
  const W=svg.clientWidth||800;
  const n=dates.length||1;const pitch=(W-pL-pR)/n;const bw=Math.max(2,pitch*0.62);
  const segs=top.concat(selModel!==null&&selModel!==-1&&!top.includes(selModel)?[selModel]:[]);
  const RC=rankColor(A);
  const colorOf=mi=>mi===-1?CJ.other:RC[mi];
  let g='',bars='',xlabels='';
  for(let i=1;i<8;i++){const y=pT+(H-pT-pB)*i/8;g+='<line x1="'+pL+'" y1="'+y+'" x2="'+(W-pR)+'" y2="'+y+'" stroke="'+CJ.grid+'" stroke-width="0.5"/>';}
  // 窗口日均参考线：超出该线的日子即为「超标日」
  const daySum=d=>Object.values(A.dm[d]||{}).reduce((a,b)=>a+b,0);
  const nD=dates.length||1;
  const avg=dates.reduce((s,d)=>s+daySum(d),0)/nD;
  const peakD=dates.reduce((b,d)=>daySum(d)>daySum(b)?d:b,dates[0]||'');
  const peakV=daySum(peakD);
  if(avg>0){
    const yA=pB+(H-pT-pB)*(1-avg/mx);
    g+='<line x1="'+pL+'" y1="'+yA.toFixed(1)+'" x2="'+(W-pR)+'" y2="'+yA.toFixed(1)+'" stroke="'+CJ.axis+'" stroke-width="1" stroke-dasharray="5 4"/>'
      +'<text x="'+(W-pR)+'" y="'+(yA-4).toFixed(1)+'" font-size="9" fill="'+CJ.axis2+'" text-anchor="end">日均 '+fmt(avg)+'</text>';
  }
  const ins=$('#dmInsight');
  if(ins)ins.innerHTML=avg>0
    ? '窗口 '+nD+' 天 · 日均 <b>'+fmt(avg)+'</b> · 峰值 <b>'+peakD+'</b>（<b>'+fmt(peakV)+'</b>，为日均 '+(peakV/avg).toFixed(1)+'×）· 超标日 <b>'+dates.filter(d=>daySum(d)>avg).length+'</b> 天'
    : '该时间范围内无数据';
  dates.forEach((d,i)=>{
    const dtt=Object.values(A.dm[d]).reduce((a,b)=>a+b,0);
    let cum=0;
    segs.forEach(mi=>{
      const v=(A.dm[d][mi]||0);if(!v)return;
      const bh=v/mx*(H-pT-pB);
      const x=pL+pitch*i+(pitch-bw)/2,y=H-pB-cum-bh;
      const dimmed=selModel!==null&&selModel!==mi;
      bars+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0.5,bh).toFixed(1)+'" fill="'+(dimmed?CJ.dimBar:colorOf(mi))+'" fill-opacity="'+(dimmed?'0.5':'0.85')+'"/>';
      cum+=bh;
    });
    const dayList=segs.map(mi=>({mi:mi,v:(A.dm[d][mi]||0)})).filter(o=>o.v>0).sort((a,b)=>b.v-a.v);
    const dayTip=d+' · 合计 '+nf(dtt)+'\n'+dayList.map(o=>'· '+(o.mi===-1?'其他':D.models[o.mi])+'  '+nf(o.v)+'（'+(dtt?(o.v/dtt*100).toFixed(1):0)+'%）').join('\n');
    bars+='<rect x="'+(pL+pitch*i).toFixed(1)+'" y="'+pT+'" width="'+pitch.toFixed(1)+'" height="'+(H-pT-pB)+'" fill="#fff" fill-opacity="0" pointer-events="all" data-tip="'+dayTip+'"/>';
    const step=Math.ceil(n/7);
    if(i%step===0||i===n-1)xlabels+='<text x="'+(pL+pitch*i+pitch/2)+'" y="'+(H-4)+'" font-size="9" fill="'+CJ.axis+'" text-anchor="middle">'+d+'</text>';
  });
  svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('height',H);
  svg.innerHTML=g+bars+xlabels+
    '<text x="'+(pL-5)+'" y="'+(pT+7)+'" font-size="9" fill="'+CJ.axis+'" text-anchor="end">'+fmt(mx)+'</text>'+
    '<text x="'+(pL-5)+'" y="'+(H-pB)+'" font-size="9" fill="'+CJ.axis+'" text-anchor="end">0</text>';
}

function renderModelDist(){
  const svg=$('#mdSvg');const W=svg.clientWidth||300;
  const c=cut(),hiC=cutHi();
  const bym={};
  for(const s of D.sess){if(ACCT>=0&&s.a!==ACCT)continue;for(const r of s.r){const ts=r[0]*60000;if(ts<c||ts>=hiC)continue;(bym[r[1]]=bym[r[1]]||[]).push(r[2]);}}

  const gp50=gpct(.5);

    d+=' L'+(W-6).toFixed(1)+' '+baseY+' Z';

    out+='<path d="'+d+'" fill="'+col+'" fill-opacity="0.3" stroke="'+col+'" stroke-width="0.8" data-tip="'+tip+'"/>'+
      '<line x1="'+X(s.p50).toFixed(1)+'" y1="'+(baseY-bh-1)+'" x2="'+X(s.p50).toFixed(1)+'" y2="'+baseY+'" stroke="'+col+'" stroke-width="1.6" data-tip="'+tip+'"/>'+
      '<circle cx="'+X(s.p90).toFixed(1)+'" cy="'+(baseY-4)+'" r="2" fill="'+CJ.axis+'" data-tip="'+tip+'"/>'+
      '<text x="0" y="'+(baseY-5.5)+'" font-size="11" fill="'+CJ.t1+'">'+esc(D.models[s.m])+'</text>'+
      '<text x="'+cntX+'" y="'+(baseY-5.5)+'" font-size="11" fill="'+CJ.t1+'">'+nf(s.n)+'</text>'+
      '<text x="'+x50+'" y="'+(baseY-9)+'" font-size="12" fill="'+CJ.t1+'">'+fmt(s.p50)+'</text>'+
      '<rect x="'+x50+'" y="'+(baseY-5)+'" width="'+barW+'" height="5" fill="'+CJ.dimBar+'" fill-opacity="0.7" data-tip="'+tip+'"/>'+
      '<rect x="'+x50+'" y="'+(baseY-5)+'" width="'+Math.max(1.2,s.p50/pScale*barW).toFixed(1)+'" height="5" fill="'+col+'" fill-opacity="0.9" data-tip="'+tip+'"/>'+
      '<text x="'+x90+'" y="'+(baseY-9)+'" font-size="12" fill="'+CJ.t1+'">'+fmt(s.p90)+'</text>'+

  });

  const stepT=1e5;
  for(let v=0;v<=cap;v+=stepT){const x=X(v);

    rows+='<tr data-tip="'+tip+'"><td>'+fdate(d)+' '+ftime(d)+'</td><td style="text-align:left">'+D.models[r[1]]+'</td><td>'+nf(r[3])+'</td><td>'+nf(r[4])+'</td><td>'+nf(r[5])+'</td><td>'+nf(r[2])+'</td></tr>';
  }
  el.innerHTML='<div class="rt-wrap"><table class="rt"><thead><tr><th>时间</th><th style="text-align:left">模型</th><th>输入</th><th>输出</th><th>缓存命中</th><th>合计</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function renderAccts(){
  const box=$('#acctPanel');if(!box)return;
  if(!D.accts||!D.accts.length){box.innerHTML='<div class="empty">本机仅检测到单一账号，无需拆分</div>';return;}
  const c=cut(),hiC=cutHi();
  const agg={};
  for(const s of D.sess){
    const ai=(s.a<0)?D.accts.length:s.a;
    const a=agg[ai]=agg[ai]||{tt:0,cred:0,n:0};
    for(const r of s.r){const ts=r[0]*60000;if(ts<c||ts>=hiC)continue;a.tt+=r[2];if(r[7]!=null)a.cred+=r[7];}
    a.n++;
  }
  const labels=D.accts.concat(['未知/未归属']);
  const order=Object.keys(agg).map(Number).sort((x,y)=>agg[y].tt-agg[x].tt);
  const grand=order.reduce((s,i)=>s+agg[i].tt,0);
  const maxT=Math.max(1,...order.map(i=>agg[i].tt));
  let h='';
  for(const i of order){
    const a=agg[i];const pct=grand?a.tt/grand*100:0;
    const on=ACCT===i;
    h+='<div class="lrow'+(on?' on':'')+'" data-acct="'+i+'">'
      +'<div class="nm" title="'+esc(labels[i]||'')+'">'+esc(labels[i]||'')+'</div>'
      +'<div class="bar"><i style="width:'+Math.max(2,(a.tt/maxT*100))+'%"></i></div>'
      +'<div class="num">'+fmt(a.tt)+'<em>'+Math.round(a.cred).toLocaleString()+' 积分 · '+a.n+' 会话 · '+pct.toFixed(1)+'%</em></div></div>';
  }
  box.innerHTML=h;
  box.querySelectorAll('[data-acct]').forEach(el=>el.onclick=()=>{const v=+el.dataset.acct;setAcct(ACCT===v?-1:v);});
  if($('#acctCap'))$('#acctCap').textContent='窗口内按账号拆分（点击某行＝把全看板下钻到该账号）';
}
function populateAcctPills(){
  const box=$('#acctSel');if(!box||!D.accts)return;
  let h='<option value="-1">全部账号</option>';
  D.accts.forEach((nm,i)=>{h+='<option value="'+i+'"'+(ACCT===i?' selected':'')+'>'+esc(nm)+'</option>';});
  box.innerHTML=h;
}

function setAcct(v){
  ACCT=v;

  const b=$('#busy');if(b)b.style.display='flex';   // 立即显示"筛选中…"，让用户看到点击已生效

}

window.__applyData=function(nd){
  if(!nd||!nd.sess)return;
  D=nd;
  PRICES=D._prices||{};PRICE_SRC=D._priceSrc||'';
  MP=D.models.map(m=>PRICES[m]||[2,8,0.4]);
  MULT=Object.assign({},MULT_FALLBACK_LITERAL,D._mult||{});MULT_SRC=D._multSrc||'';
  MPM=D.models.map(m=>multOf(m));
  genMs=D.genMs;
  ACCT=-1;selModel=null;hrSel=null;state={ws:null,ses:null};
  document.querySelectorAll('.wrap').forEach(w=>w.style.display='');
  document.querySelectorAll('body > div').forEach(d=>{if(d.id!=='tip'&&d.id!=='busy'&&!d.classList.contains('wrap'))return;});
  bootRender();
};
window.__sse=function(url){
  try{
    const es=new EventSource(url);
    es.onopen=()=>{const lb=$('#liveBadge');if(lb)lb.classList.remove('off');};
    es.onmessage=e=>{try{window.__applyData(JSON.parse(e.data));}catch(err){}};
    es.onerror=()=>{const lb=$('#liveBadge');if(lb){lb.classList.add('off');lb.title='实时通道已断开';}};
    return es;
  }catch(e){return null;}
};
